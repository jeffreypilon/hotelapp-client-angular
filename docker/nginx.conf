server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular Router uses the History API -- a deep-link reload (e.g. /properties/123) must still
    # resolve to index.html, not a bare nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
