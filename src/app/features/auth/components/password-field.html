<label [attr.for]="controlId()" class="flex flex-col gap-1 text-sm font-medium text-slate-700">
  {{ label() }}
  @if (hint()) {
    <span class="text-xs font-normal text-slate-500">{{ hint() }}</span>
  }
  <span class="flex items-stretch gap-2">
    <input
      [id]="controlId()"
      [type]="visible() ? 'text' : 'password'"
      [autocomplete]="autoComplete()"
      [attr.maxlength]="maxLength() ?? null"
      [attr.aria-invalid]="error() ? true : null"
      [attr.aria-describedby]="error() ? controlId() + '-error' : null"
      class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm"
      [formControl]="control()"
    />
    <button
      type="button"
      (click)="toggleVisible()"
      [attr.aria-pressed]="visible()"
      class="shrink-0 rounded-md border border-slate-300 px-3 text-xs font-medium text-slate-700"
    >
      {{ visible() ? 'Hide' : 'Show' }}
    </button>
  </span>
  @if (error()) {
    <span [id]="controlId() + '-error'" class="text-xs text-red-700">{{ error() }}</span>
  }
</label>
