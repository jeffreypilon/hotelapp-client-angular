<main class="mx-auto max-w-3xl px-4 py-8">
  @if (store.isRoomTypeLoading()) {
    <div class="h-48 animate-pulse rounded-md bg-slate-200"></div>
  }

  @if (store.isRoomTypeError()) {
    <div class="text-center">
      <h1 class="text-2xl font-semibold text-slate-900">
        {{
          store.roomTypeError()?.code === 'NOT_FOUND'
            ? "We couldn't find that room."
            : store.roomTypeError()?.detail || 'Something went wrong. Please try again.'
        }}
      </h1>
      <a routerLink="/" class="mt-4 inline-block font-medium text-slate-900 underline">
        Back to our hotels
      </a>
    </div>
  }

  @if (store.roomType(); as roomType) {
    <app-room-type-detail-content [roomType]="roomType" />
  }
</main>
