<article class="flex flex-col gap-4 rounded-lg border border-slate-200 p-4 sm:flex-row">
  <button
    type="button"
    (click)="selectRoomType.emit()"
    class="flex flex-1 flex-col gap-4 text-left sm:flex-row"
  >
    <div class="aspect-video w-full shrink-0 overflow-hidden rounded-md bg-slate-100 sm:w-56">
      @if (primaryPhotoUrl(roomType()); as photoUrl) {
        <img [src]="photoUrl" alt="" loading="lazy" class="h-full w-full object-cover" />
      } @else {
        <div class="flex h-full items-center justify-center text-xl font-semibold text-slate-400">
          {{ getInitials(roomType().name) }}
        </div>
      }
    </div>
    <div class="flex-1">
      <div class="flex flex-wrap items-center gap-2">
        <h3 class="text-lg font-medium text-slate-900">{{ roomType().name }}</h3>
        @if (roomType().isAccessible) {
          <span
            class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-700"
            aria-label="This room type is wheelchair accessible"
          >
            Accessible
          </span>
        }
      </div>
      <p class="text-sm text-slate-600">{{ roomTypeCategoryLabel(roomType().code) }}</p>
      <p class="text-sm text-slate-600">{{ roomType().bedConfiguration }}</p>
      <p class="text-sm text-slate-600">
        {{ occupancyLabel(roomType().code, roomType().maxOccupancy) }}
      </p>
      @if (roomType().amenities.length > 0) {
        <ul class="mt-2 flex flex-wrap gap-2">
          @for (amenity of roomType().amenities; track amenity.code) {
            <li class="rounded-full bg-slate-100 px-2 py-0.5 text-xs text-slate-700">
              {{ amenity.name }}
            </li>
          }
        </ul>
      }
      <p class="mt-2 font-medium text-slate-900">
        From {{ roomType().baseRate | money: roomType().currency }} /
        {{ rateUnit(roomType().code) }}
      </p>
    </div>
  </button>
  <div class="flex items-end sm:items-center">
    <button
      type="button"
      (click)="checkAvailability.emit()"
      class="rounded-md bg-slate-900 px-4 py-2 text-sm font-medium whitespace-nowrap text-white hover:bg-slate-700"
    >
      Check availability
    </button>
  </div>
</article>
