<main class="mx-auto max-w-sm px-4 py-8">
  <h1 class="text-2xl font-semibold text-slate-900">Change password</h1>

  @if (successMessage()) {
    <div
      role="status"
      aria-live="polite"
      class="mt-6 rounded-md border border-green-200 bg-green-50 p-3 text-sm text-green-800"
    >
      {{ successMessage() }}
    </div>
  }
  @if (formError()) {
    <div
      role="alert"
      aria-live="assertive"
      class="mt-6 rounded-md border border-red-200 bg-red-50 p-3 text-sm text-red-800"
    >
      {{ formError() }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" [formGroup]="form" novalidate class="mt-6 flex flex-col gap-4">
    <app-password-field
      [control]="form.controls.currentPassword"
      controlId="currentPassword"
      label="Current password"
      autoComplete="current-password"
      [error]="currentPasswordError()"
    />
    <app-password-field
      [control]="form.controls.newPassword"
      controlId="newPassword"
      label="New password"
      autoComplete="new-password"
      hint="12–24 characters."
      [maxLength]="24"
      [error]="newPasswordError()"
    />
    <app-password-field
      [control]="form.controls.confirmNewPassword"
      controlId="confirmNewPassword"
      label="Confirm new password"
      autoComplete="new-password"
      [maxLength]="24"
      [error]="confirmNewPasswordError()"
    />

    <button
      type="submit"
      [disabled]="submitting()"
      class="rounded-md bg-brand px-4 py-2 text-sm font-medium text-white disabled:opacity-50"
    >
      {{ submitting() ? 'Updating…' : 'Update password' }}
    </button>
  </form>
</main>
